[project]
name = "desktop-organizer"
version = "1.0.0"
description = "Local Windows toolbox: file cleaner, backup, notes, duplicates, reminders and more."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved" }
dependencies = [
    "PySide6==6.12.0",
    "psutil==7.2.2",
    "Send2Trash==2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop_organizer = ["resources/lang/*.json", "resources/icons/*.ico"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "build"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["send2trash.*", "psutil.*", "PyInstaller.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:desktop_organizer.*"]
